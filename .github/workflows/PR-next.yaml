name: PUSH:next_release

on:
  push:
    branches:
      - next_release

jobs:
  macOS-ARM64-v4d:
    name: macOS ARM64 (v4d/plan)
    runs-on: macos-14
    steps:
      - name: Checkout this repo (contrib modules)
        uses: actions/checkout@v4
        with:
          path: opencv_contrib
      - name: Install dependencies
        run: brew install glfw
      - name: Clone main OpenCV
        run: git clone --depth 1 --branch 4.x https://github.com/opencv/opencv.git
      - name: Configure
        run: |
          cmake -B build -DOPENCV_EXTRA_MODULES_PATH=../opencv_contrib/modules \
                -DBUILD_opencv_plan=ON -DBUILD_opencv_v4d=ON \
                -DBUILD_EXAMPLES=ON -DWITH_OPENCL=OFF \
                -DWITH_FFMPEG=OFF -DBUILD_TESTS=OFF -DBUILD_PERF_TESTS=OFF
        working-directory: opencv
      - name: Build v4d sample
        run: cmake --build build --target example_v4d_video_editing -j 4
        working-directory: opencv

  macOS-X64-v4d:
    name: macOS x86_64 (v4d/plan)
    runs-on: macos-13
    steps:
      - name: Checkout this repo (contrib modules)
        uses: actions/checkout@v4
        with:
          path: opencv_contrib
      - name: Install dependencies
        run: brew install glfw
      - name: Clone main OpenCV
        run: git clone --depth 1 --branch 4.x https://github.com/opencv/opencv.git
      - name: Configure
        run: |
          cmake -B build -DOPENCV_EXTRA_MODULES_PATH=../opencv_contrib/modules \
                -DBUILD_opencv_plan=ON -DBUILD_opencv_v4d=ON \
                -DBUILD_EXAMPLES=ON -DWITH_OPENCL=OFF \
                -DWITH_FFMPEG=OFF -DBUILD_TESTS=OFF -DBUILD_PERF_TESTS=OFF
        working-directory: opencv
      - name: Build v4d sample
        run: cmake --build build --target example_v4d_video_editing -j 3
        working-directory: opencv

  Linux:
    uses: opencv/ci-gha-workflow/.github/workflows/OCV-PR-Linux.yaml@main
    with:
      workflow_branch: main

  Ubuntu2004-ARM64:
    uses: opencv/ci-gha-workflow/.github/workflows/OCV-Contrib-PR-4.x-ARM64.yaml@main

  Ubuntu2004-ARM64-FastCV:
    uses: opencv/ci-gha-workflow/.github/workflows/OCV-Contrib-PR-4.x-ARM64-FastCV.yaml@main

  Ubuntu2004-x64-CUDA:
    uses: opencv/ci-gha-workflow/.github/workflows/OCV-Contrib-PR-4.x-U20-Cuda.yaml@main

  Windows10-x64:
    uses: opencv/ci-gha-workflow/.github/workflows/OCV-Contrib-PR-4.x-W10.yaml@main

  macOS-ARM64:
    uses: opencv/ci-gha-workflow/.github/workflows/OCV-Contrib-PR-4.x-macOS-ARM64.yaml@main

  macOS-X64:
    uses: opencv/ci-gha-workflow/.github/workflows/OCV-Contrib-PR-4.x-macOS-x86_64.yaml@main

  Linux-RISC-V-Clang:
    uses: opencv/ci-gha-workflow/.github/workflows/OCV-Contrib-PR-4.x-RISCV.yaml@main

  openEuler2203-x64:
    if: "${{ contains(github.event.pull_request.labels.*.name, 'category: cann') }}"
    uses: opencv/ci-gha-workflow/.github/workflows/OCV-Contrib-PR-4.x-O22-CANN.yaml@main
